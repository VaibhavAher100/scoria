name: Release

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rust:
    name: Build Rust ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: macos-latest
            platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
            ext: ''
          - os: macos-latest
            platform: darwin
            arch: x64
            target: x86_64-apple-darwin
            ext: ''
          - os: ubuntu-latest
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            ext: ''
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            ext: ''

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-servers -> target
          key: ${{ matrix.target }}

      - name: Build
        working-directory: rust-servers
        env:
          TERMINAL_SERVER_VERSION: ${{ github.ref_name }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p binaries
          BINARY_NAME="scoria-server-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}"
          cp "rust-servers/target/${{ matrix.target }}/release/scoria-server${{ matrix.ext }}" "binaries/${BINARY_NAME}"
          
          cd binaries
          if command -v sha256sum &> /dev/null; then
            sha256sum "${BINARY_NAME}" > "${BINARY_NAME}.sha256"
          else
            shasum -a 256 "${BINARY_NAME}" > "${BINARY_NAME}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            binaries/scoria-server-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}
            binaries/scoria-server-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}.sha256

  release:
    name: Release
    needs: build-rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v5

      # The plugin downloads its binary from the release named after its manifest
      # version, so a tag that differs from manifest.json gives a broken install.
      - name: Check tag matches manifest version
        run: |
          node -e '
            const v = require("./manifest.json").version;
            if (v !== process.argv[1]) { console.error(`tag ${process.argv[1]} != manifest.json ${v}`); process.exit(1); }
          ' "${{ github.ref_name }}"

      - uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          pattern: 'server-*'
          path: binaries
          merge-multiple: true

      - name: Set permissions
        run: |
          chmod +x binaries/scoria-server-darwin-* || true
          chmod +x binaries/scoria-server-linux-* || true

      # S2: the plugin bundle carries each binary's SHA-256, so the downloader
      # never trusts a checksum file from the same host as the binary.
      - name: Pin binary hashes into the plugin bundle
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const names = ["win32-x64.exe", "darwin-arm64", "darwin-x64", "linux-x64", "linux-arm64"].map((s) => "scoria-server-" + s);
            const pins = {};
            // Hash the binaries themselves; readFileSync throws if one is missing.
            for (const f of names) pins[f] = crypto.createHash("sha256").update(fs.readFileSync("binaries/" + f)).digest("hex");
            fs.writeFileSync("src/services/server/pinnedHashes.json", JSON.stringify(pins, null, 2) + "\n");
          '
          cat src/services/server/pinnedHashes.json

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Generate release notes
        run: |
          node scripts/release-notes.js \
            --version "${{ github.ref_name }}" \
            --repository "${{ github.repository }}" \
            --output release-body.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            binaries/scoria-server-*

      - name: Prepare release assets
        run: |
          # BRAT 需要的三个核心文件（直接上传，不打包）
          # main.js, manifest.json, styles.css 已在根目录
          
          # 设置二进制文件执行权限
          chmod +x binaries/scoria-server-darwin-* || true
          chmod +x binaries/scoria-server-linux-* || true
          
          # 创建完整包（所有平台，供手动安装）
          mkdir -p scoria/binaries
          cp main.js manifest.json styles.css scoria/
          cp binaries/scoria-server-* scoria/binaries/
          chmod +x scoria/binaries/scoria-server-darwin-* || true
          chmod +x scoria/binaries/scoria-server-linux-* || true
          zip -r "scoria-${{ github.ref_name }}.zip" scoria

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            main.js
            manifest.json
            styles.css
            scoria-${{ github.ref_name }}.zip
            binaries/scoria-server-win32-x64.exe
            binaries/scoria-server-win32-x64.exe.sha256
            binaries/scoria-server-darwin-arm64
            binaries/scoria-server-darwin-arm64.sha256
            binaries/scoria-server-darwin-x64
            binaries/scoria-server-darwin-x64.sha256
            binaries/scoria-server-linux-x64
            binaries/scoria-server-linux-x64.sha256
            binaries/scoria-server-linux-arm64
            binaries/scoria-server-linux-arm64.sha256
          body_path: release-body.md
          draft: false
          prerelease: false
